# Publishes docs/ to GitHub Pages, and refreshes the Real-Time Crime Index data.
#
# - A push to main runs the tests and deploys the site as committed.
# - Every Monday (and on a manual "Run workflow"), scripts/build_data.py checks
#   the Crime Index (formerly RTCI) download page. If the data changed and the
#   tests still pass, the new data are committed to main and the site is
#   redeployed. If nothing changed, the scheduled run stops without committing
#   or deploying.
# - Scheduled and manual runs then email the result (updated, no update, or
#   failed with the log attached) using the SMTP_PASSWORD repository secret.
name: Update data and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.data.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv has no major-version tags

      - name: Refresh RTCI data
        id: data
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run python scripts/build_data.py 2>&1 | tee -a run.log
          if git diff --quiet -- docs/data data/source_metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee -a run.log

      - name: Commit updated data
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/source_metadata.json
          git commit -m "Update RTCI data"
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Keep the log for the email
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore

  deploy:
    needs: build
    # Scheduled runs deploy only when the data changed
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    # Email the result of scheduled and manual refreshes (not pushes)
    needs: [build, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: run-log

      - name: Email the result
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          CHANGED: ${{ needs.build.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          data=$(grep -h "^Wrote docs" run.log 2>/dev/null | tail -1 || true)
          if [ "$BUILD" = success ] && { [ "$DEPLOY" = success ] || [ "$DEPLOY" = skipped ]; }; then
            if [ "$CHANGED" = true ]; then result="updated with new RTCI data"; else result="no update"; fi
            body=$(printf 'The weekly SynthRTCI refresh finished: %s.\n\n%s\nSite: https://apwheele.github.io/SynthRTCI/\nRun: %s\n' \
              "$result" "$data" "$RUN_URL")
            python3 scripts/send_mail.py --subject "SynthRTCI weekly refresh: $result" --body "$body"
          else
            body=$(printf 'The weekly SynthRTCI refresh failed (build: %s, deploy: %s).\n\nRun: %s\nThe log of the refresh and test steps is attached.\n' \
              "$BUILD" "$DEPLOY" "$RUN_URL")
            python3 scripts/send_mail.py --subject "SynthRTCI weekly refresh FAILED" --body "$body" --attach run.log
          fi
